services:
  db:
    image: postgres:15-alpine
    container_name: buenas-lecturas-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: buenas_lecturas
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buenas-lecturas-backend
    restart: always
    environment:
      DATABASE_HOST: buenas-lecturas-db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: buenas_lecturas
      JWT_SECRET: ${JWT_SECRET:-SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    depends_on:
      - db
    networks:
      - app-network
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
    container_name: buenas-lecturas-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - app-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.buenaslecturas.rule=Host(`buenas-lecturas.costacode.es`)"
      - "traefik.http.routers.buenaslecturas.entrypoints=websecure"
      - "traefik.http.routers.buenaslecturas.tls.certresolver=letsencrypt"
      - "traefik.http.services.buenaslecturas.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"

volumes:
  postgres_data:
  backend_uploads:

networks:
  dokploy-network:
    external: true
  app-network:
    driver: bridge
